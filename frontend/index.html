<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Tema antes da primeira pintura (sem piscar). Mesma lógica de applyInitialTheme em src/shared/theme/theme.ts. -->
    <script>
      (function () {
        var pref = "system";
        try {
          var stored = window.localStorage.getItem("ui.theme");
          if (stored === "light" || stored === "dark" || stored === "system") pref = stored;
        } catch (e) {}
        var dark = pref === "dark";
        if (pref === "system") {
          try {
            dark = typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}
        }
        var theme = dark ? "dark" : "light";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#020617" : "#0f172a");
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Estoque" />
    <title>Estoque</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
