name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:db:prepare
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test (GET /health)
        run: |
          node dist/server.js > server.log 2>&1 &
          server_pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then ok=1; break; fi
            sleep 1
          done
          kill "$server_pid" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "health check não respondeu 200 em 30 s"
            cat server.log
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
